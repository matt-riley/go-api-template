name: Docker

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: matt-riley/matt-riley-ci/.github/workflows/docker-ghcr-publish.yml@0a310f1286537ed4fd000af4b35cd6459b00448d # v4
    with:
      tag-name: ${{ github.ref_name }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
