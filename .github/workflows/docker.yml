name: Docker

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: matt-riley/matt-riley-ci/.github/workflows/docker-ghcr-publish.yml@e8a2503259d33b925cad2bc018e052a2579f441d # v4
    with:
      tag-name: ${{ github.ref_name }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
