name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:test
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@0a310f1286537ed4fd000af4b35cd6459b00448d # v4
    with:
      run-vet: false
      run-test: true
      run-fmt: true

  lint:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:lint
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/go-lint.yml@0a310f1286537ed4fd000af4b35cd6459b00448d # v4

  security:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:security
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@0a310f1286537ed4fd000af4b35cd6459b00448d # v4
