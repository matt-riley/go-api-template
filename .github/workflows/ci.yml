name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@0d1d8e7a149a53fcaaca6e128f62e0e3d8fdf293 # v2
    with:
      run-race: true
      run-fmt: true

  lint:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-lint.yml@0d1d8e7a149a53fcaaca6e128f62e0e3d8fdf293 # v2

  security:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@0d1d8e7a149a53fcaaca6e128f62e0e3d8fdf293 # v2
